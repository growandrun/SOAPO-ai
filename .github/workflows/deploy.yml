name: 배포

# 기본 브랜치에 push하면 GitHub Pages로 배포한다.
#   /       실제 서비스 앱 (app/)
#   /demo/  가짜 데이터 데모 (prototype/)
# 저장소 Settings → Secrets and variables → Actions 에 아래 값이 있으면 Supabase도 함께 설정한다.
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD  (필수 3개)
#   RESEND_API_KEY + MAIL_FROM  또는  SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASS + MAIL_FROM  (환자에게 메일을 보내려면 필요)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        name: GitHub Pages 확인 (Settings → Pages → Source를 "GitHub Actions"로 한 번 켜 주세요)
        uses: actions/configure-pages@v5
      - name: 사이트 파일 모으기
        run: |
          mkdir -p _site/demo
          cp -r app/. _site/
          cp prototype/index.html _site/demo/index.html
      - name: Supabase 설정 (DB 구조, 로그인 메일, 앱 설정)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          CONFIG_OUT: _site/config.js
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase 비밀값이 없어 설정 안내 화면으로 배포합니다. /demo/ 데모는 그대로 동작합니다."
            printf 'window.SOAPO_CONFIG = { supabaseUrl: "", supabaseKey: "" };\n' > _site/config.js
            exit 0
          fi
          npm ci
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db push
          node scripts/configure-supabase.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
